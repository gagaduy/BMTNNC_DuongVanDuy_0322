<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center font-weight-bold">CAESAR CIPHER</h2>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <h4 class="text-primary font-weight-bold">ENCRYPTION</h4>
                <form method="POST" action="/encrypt">
                    <div class="form-group">
                        <label>Plain text:</label>
                        <input type="text" class="form-control" name="inputPlainText" value="{{ origin_plaintext if origin_plaintext else '' }}" placeholder="Input Plain Text" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Key (Number):</label>
                        <input type="number" class="form-control" name="inputKeyPlain" value="{{ origin_key if origin_key else '' }}" placeholder="Input Key" required>
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">Encrypt</button>
                </form>
                
                {% if encrypted_text %}
                <div class="alert alert-primary shadow-sm">
                    <strong>Bản mã thu được:</strong><br>
                    <span class="font-weight-bold text-danger" style="font-size: 18px; word-break: break-all;">{{ encrypted_text }}</span>
                </div>
                {% endif %}
            </div>
            
            <div class="col-md-6">
                <h4 class="text-success font-weight-bold">DECRYPTION</h4>
                <form method="POST" action="/decrypt">
                    <div class="form-group">
                        <label>Cipher text:</label>
                        <input type="text" class="form-control" name="inputCipherText" value="{{ origin_ciphertext if origin_ciphertext else '' }}" placeholder="Input Cipher Text" required>
                    </div>
                    <div class="form-group">
                        <label>Key (Number):</label>
                        <input type="number" class="form-control" name="inputKeyCipher" value="{{ origin_key if origin_key else '' }}" placeholder="Input Key" required>
                    </div>
                    <button type="submit" class="btn btn-success mb-3">Decrypt</button>
                </form>

                {% if decrypted_text %}
                <div class="alert alert-success shadow-sm">
                    <strong>Bản rõ giải mã:</strong><br>
                    <span class="font-weight-bold text-success" style="font-size: 18px; word-break: break-all;">{{ decrypted_text }}</span>
                </div>
                {% endif %}
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/" class="btn btn-secondary">Back to Menu</a>
        </div>
    </div>
</body>
</html>
